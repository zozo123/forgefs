name: apply-362-staged-export

on:
  push:
    branches:
      - perf/362-staged-streaming-export

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Apply exact source transformation
        run: python3 scripts/apply-362-staged-export.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Large-object staged-stream memory regression
        run: cargo test --locked -p forge-store --test large_blob_memory -- --nocapture
      - name: Staged export trust regression
        run: cargo test --locked -p forge-api --test export_streaming_trust -- --nocapture
      - name: Existing export adapter regressions
        run: cargo test --locked -p forge-api --test export_name_collisions --test export_long_names
      - name: Full suite
        run: cargo test --workspace --all-targets --locked
      - name: Commit only proven product changes
        run: |
          rm scripts/apply-362-staged-export.py .github/workflows/apply-362-staged-export.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(export): stream verified Blobs into staged tar (#362)'
          git push origin HEAD:perf/362-staged-streaming-export
