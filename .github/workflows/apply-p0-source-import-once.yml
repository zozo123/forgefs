name: apply-p0-source-import-once

on:
  push:
    branches:
      - forgefs/p0-source-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Patch P0 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/forge-api/src/lib.rs")
          s = path.read_text()

          branch_old = (
              "    pub fn branch(&self, cap: &Cap, from: &str, name: &str) -> Result<ObjectId> {\n"
              "        self.check(cap, Op::Branch, Some(name))?;\n"
              "        let (oid, _) = self.peel_commit(from)?;\n"
          )
          branch_new = (
              "    pub fn branch(&self, cap: &Cap, from: &str, name: &str) -> Result<ObjectId> {\n"
              "        self.check(cap, Op::Branch, Some(name))?;\n"
              "        self.check_spec_read(cap, from)?;\n"
              "        let (oid, _) = self.peel_commit(from)?;\n"
          )
          if s.count(branch_old) != 1:
              raise SystemExit("branch patch anchor not unique")
          s = s.replace(branch_old, branch_new, 1)

          merge_old = (
              "        let ours_c = self.store.get_commit(into_row.oid)?;\n"
              "        let (theirs_oid, theirs_c) = self.peel_commit(from)?;\n"
          )
          merge_new = (
              "        self.check_spec_read(cap, from)?;\n"
              "        let ours_c = self.store.get_commit(into_row.oid)?;\n"
              "        let (theirs_oid, theirs_c) = self.peel_commit(from)?;\n"
          )
          if s.count(merge_old) != 1:
              raise SystemExit("merge patch anchor not unique")
          s = s.replace(merge_old, merge_new, 1)

          start = s.index("    pub fn import_dir(")
          end = s.index("\n    pub fn landmark(", start)
          import_new = "\n".join([
              "    pub fn import_dir(&self, cap: &Cap, dir: &Path, r#ref: &str) -> Result<ObjectId> {",
              "        self.check(cap, Op::Write, Some(r#ref))?;",
              "        let previous = self.store.meta.get_ref(r#ref)?;",
              "        let previous_commit = match previous.as_ref() {",
              "            Some(row) => Some(self.store.get_commit(row.oid)?),",
              "            None => None,",
              "        };",
              "        let tree = import_walk(&self.store, dir)?;",
              "        let parents = previous",
              "            .as_ref()",
              "            .map(|row| vec![row.oid])",
              "            .unwrap_or_default();",
              "        let commit = Commit {",
              "            tree,",
              "            parents,",
              "            agent: cap.agent_id().into(),",
              "            msg: format!(\"import {}\", dir.display()),",
              "            ts: now_ms(),",
              "            landmark: false,",
              "        };",
              "        let cid = self.store.put_commit(&commit)?;",
              "        self.store.record_intros(",
              "            previous_commit.as_ref().map(|c| c.tree),",
              "            tree,",
              "            cid,",
              "            cap.agent_id(),",
              "        )?;",
              "        match previous {",
              "            Some(row) => {",
              "                self.store.meta.cas_ref(",
              "                    r#ref,",
              "                    row.oid,",
              "                    cid,",
              "                    \"commit\",",
              "                    cap.agent_id(),",
              "                    cap.agent_id(),",
              "                    false,",
              "                )?;",
              "            }",
              "            None => {",
              "                self.store.meta.insert_ref(",
              "                    r#ref,",
              "                    cid,",
              "                    \"commit\",",
              "                    false,",
              "                    false,",
              "                    cap.agent_id(),",
              "                    \"import\",",
              "                )?;",
              "            }",
              "        }",
              "        Ok(cid)",
              "    }",
              "",
          ])
          s = s[:start] + import_new + s[end:]
          path.write_text(s)
          PY
      - name: Format and targeted regression tests
        run: |
          cargo fmt --all
          cargo test -p forge-api --test p0_authority_history --locked
      - name: Commit patch and remove one-shot artifacts
        run: |
          rm .github/workflows/apply-p0-source-import-once.yml
          rm -f .ci-trigger-p0-source-import
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-api/src/lib.rs .github/workflows/apply-p0-source-import-once.yml .ci-trigger-p0-source-import
          git commit -m "Fix source authority and import ancestry"
          git push
