name: autopatch-inbox-111

on:
  push:
    branches: [agents/inbox-111]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agents/inbox-111
          persist-credentials: true
      - name: Add reserved inbox refs and native API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/forge-store/src/meta.rs')
          s = p.read_text()
          old = '''    let expected = if name == "main" || name.starts_with("heads/") || name.starts_with("forks/") {\n        Some("commit")\n    } else if name.starts_with("conflicts/") {\n        Some("conflict")\n    } else if name.starts_with("tags/") {\n        Some("snapshot")\n    } else {\n        None\n    };'''
          new = '''    if let Some(rest) = name.strip_prefix("inbox/") {\n        let mut parts = rest.split('/');\n        let agent = parts.next().unwrap_or_default();\n        let id = parts.next().unwrap_or_default();\n        if parts.next().is_some()\n            || agent.is_empty()\n            || sanitize_agent(agent) != agent\n            || ulid::Ulid::from_string(id).is_err()\n        {\n            return Err(Error::Invalid(format!("invalid inbox ref {name:?}")));\n        }\n    }\n\n    let expected = if name == "main" || name.starts_with("heads/") {\n        Some("commit")\n    } else if name.starts_with("forks/inbox/") {\n        Some("snapshot")\n    } else if name.starts_with("forks/") {\n        Some("commit")\n    } else if name.starts_with("conflicts/") {\n        Some("conflict")\n    } else if name.starts_with("tags/") || name.starts_with("inbox/") {\n        Some("snapshot")\n    } else {\n        None\n    };'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('crates/forge-api/src/lib.rs')
          s = p.read_text()
          marker = '''    pub fn refs(&self, cap: &Cap) -> Result<Vec<RefRow>> {\n        self.check(cap, Op::Read, None)?;\n        let mut out = Vec::new();\n        for r in self.store.meta.list_refs()? {\n            if cap.allows(Op::Read, Some(&r.name), now_ms()).is_ok() {\n                out.push(r);\n            }\n        }\n        Ok(out)\n    }'''
          addition = marker + '''\n\n    /// Publish an immutable sealed snapshot to a recipient-owned inbox ref.\n    /// ForgeFS stores only the durable pointer; scheduling/messaging stays above the core.\n    pub fn inbox_push(&self, cap: &Cap, to: &str, snapshot: &str) -> Result<CasResult> {\n        let recipient = sanitize_agent(to);\n        if recipient != to || recipient == "anon" {\n            return Err(Error::Invalid(format!("invalid inbox recipient {to:?}")));\n        }\n        self.check_spec_read(cap, snapshot)?;\n        let oid = self.resolve_spec_oid(snapshot)?;\n        if self.store.object_type(oid)? != ObjectType::Snapshot {\n            return Err(Error::Invalid("inbox payload must be a sealed snapshot".into()));\n        }\n        let name = format!("inbox/{recipient}/{}", ulid::Ulid::new());\n        self.check(cap, Op::Write, Some(&name))?;\n        self.store.meta.cas_ref(\n            &name,\n            ObjectId([0; 32]),\n            oid,\n            "snapshot",\n            cap.agent_id(),\n            cap.agent_id(),\n            false,\n        )\n    }\n\n    /// List only the calling agent's concrete inbox refs that its cap can read.\n    pub fn inbox_list(&self, cap: &Cap) -> Result<Vec<RefRow>> {\n        verify(&self.hmac_key, cap)?;\n        let agent = sanitize_agent(cap.agent_id());\n        let prefix = format!("inbox/{agent}/");\n        let mut out = Vec::new();\n        for row in self.store.meta.list_refs()? {\n            if row.name.starts_with(&prefix)\n                && cap.allows(Op::Read, Some(&row.name), now_ms()).is_ok()\n            {\n                out.push(row);\n            }\n        }\n        Ok(out)\n    }'''
          assert s.count(marker) == 1
          p.write_text(s.replace(marker, addition))
          PY

          cat > crates/forge-api/tests/inbox_refs.rs <<'RS'
          use forge_api::Forge;
          use forge_types::CasResult;
          use tempfile::tempdir;

          #[test]
          fn sealed_snapshot_can_be_published_to_recipient_inbox() {
              let d = tempdir().unwrap();
              let forge = Forge::init(d.path()).unwrap();
              let root = forge.root_cap().unwrap();
              let snap = forge.seal(&root, "main", "v1.0").unwrap();

              let alice = forge
                  .grant(
                      &root,
                      vec![
                          "ops=read,write".into(),
                          "agent=alice".into(),
                          "ref=tags/v1.0,inbox/bob/*".into(),
                      ],
                  )
                  .unwrap();
              let bob = forge
                  .grant(
                      &root,
                      vec![
                          "ops=read".into(),
                          "agent=bob".into(),
                          "ref=inbox/bob/*".into(),
                      ],
                  )
                  .unwrap();

              let result = forge.inbox_push(&alice, "bob", "tags/v1.0").unwrap();
              let CasResult::Updated { name, oid } = result else {
                  panic!("new inbox ref must publish directly");
              };
              assert!(name.starts_with("inbox/bob/"));
              assert_eq!(oid, snap);

              let rows = forge.inbox_list(&bob).unwrap();
              assert_eq!(rows.len(), 1);
              assert_eq!(rows[0].name, name);
              assert_eq!(rows[0].oid, snap);
              assert_eq!(rows[0].kind, "snapshot");
          }

          #[test]
          fn inbox_write_requires_concrete_prefix_authority() {
              let d = tempdir().unwrap();
              let forge = Forge::init(d.path()).unwrap();
              let root = forge.root_cap().unwrap();
              forge.seal(&root, "main", "v1.0").unwrap();
              let alice = forge
                  .grant(
                      &root,
                      vec![
                          "ops=read,write".into(),
                          "agent=alice".into(),
                          "ref=tags/v1.0,inbox/alice/*".into(),
                      ],
                  )
                  .unwrap();
              assert!(forge.inbox_push(&alice, "bob", "tags/v1.0").is_err());
          }
          RS

          cargo fmt --all
          git rm .github/workflows/autopatch-inbox-111.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-store/src/meta.rs crates/forge-api/src/lib.rs crates/forge-api/tests/inbox_refs.rs
          git commit -m 'agents: add capability-scoped snapshot inbox refs (#111)'
          git push origin HEAD:agents/inbox-111
