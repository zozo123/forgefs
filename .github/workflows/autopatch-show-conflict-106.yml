name: autopatch-show-conflict-106

on:
  push:
    branches: [cli/show-conflict-106]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cli/show-conflict-106
          persist-credentials: true
      - name: Implement detailed conflict show
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/forge-api/src/lib.rs')
          s = p.read_text()
          old = '''    pub fn show(&self, cap: &Cap, spec: &str) -> Result<String> {\n        self.check_spec_read(cap, spec)?;\n        let oid = self.resolve_spec_oid(spec)?;\n        let bytes = self.store.get_raw(oid)?;\n        Ok(format!(\n            "{} {} bytes",\n            self.store.object_type(oid)?.as_str(),\n            bytes.len()\n        ))\n    }'''
          new = '''    pub fn show(&self, cap: &Cap, spec: &str) -> Result<String> {\n        self.check_spec_read(cap, spec)?;\n        let oid = self.resolve_spec_oid(spec)?;\n        let ty = self.store.object_type(oid)?;\n        if ty == ObjectType::Conflict {\n            let conflict = self.store.get_conflict(oid)?;\n            let fmt_oid = |id: Option<ObjectId>| id.map(|v| v.hex()).unwrap_or_else(|| "-".into());\n            let mut out = String::new();\n            out.push_str(&format!("conflict {oid}\\n"));\n            out.push_str(&format!(\n                "bases {}\\n",\n                if conflict.bases.is_empty() {\n                    "-".into()\n                } else {\n                    conflict.bases.iter().map(ObjectId::hex).collect::<Vec<_>>().join(",")\n                }\n            ));\n            out.push_str(&format!("ours {}\\n", conflict.ours));\n            out.push_str(&format!("theirs {}\\n", conflict.theirs));\n            for path in conflict.paths {\n                out.push_str(&format!(\n                    "path {} a={} b={} base={}\\n",\n                    path.path,\n                    fmt_oid(path.a),\n                    fmt_oid(path.b),\n                    fmt_oid(path.base)\n                ));\n            }\n            if !conflict.causal.is_empty() {\n                out.push_str(&format!(\n                    "causal {}\\n",\n                    conflict.causal.iter().map(ObjectId::hex).collect::<Vec<_>>().join(",")\n                ));\n            }\n            return Ok(out.trim_end().to_string());\n        }\n        let bytes = self.store.get_raw(oid)?;\n        Ok(format!("{} {} bytes", ty.as_str(), bytes.len()))\n    }'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY

          cat > crates/forge-api/tests/show_conflict.rs <<'RS'
          use forge_api::Forge;
          use forge_core::{Commit, Tree, TreeEntry};
          use forge_store::Store;
          use forge_types::{EntryKind, Error, ObjectId};
          use tempfile::tempdir;

          fn store(dir: &std::path::Path) -> Store {
              Store::open(&dir.join(".forge")).unwrap()
          }

          fn tree(store: &Store, data: &[u8]) -> ObjectId {
              let blob = store.put_blob_data(data).unwrap();
              store
                  .put_tree(
                      &Tree::new(vec![TreeEntry {
                          name: "same.txt".into(),
                          kind: EntryKind::Blob,
                          id: blob,
                          exec: false,
                      }])
                      .unwrap(),
                  )
                  .unwrap()
          }

          fn commit(store: &Store, tree: ObjectId, parent: ObjectId, n: u64) -> ObjectId {
              store
                  .put_commit(&Commit {
                      tree,
                      parents: vec![parent],
                      agent: "show-test".into(),
                      msg: format!("c{n}"),
                      ts: n,
                      landmark: false,
                  })
                  .unwrap()
          }

          #[test]
          fn show_conflict_exposes_both_sides_and_typed_path_oids() {
              let d = tempdir().unwrap();
              let forge = Forge::init(d.path()).unwrap();
              let root = forge.root_cap().unwrap();
              let s = store(d.path());
              let main = s.meta.get_ref("main").unwrap().unwrap();
              let base = s.get_commit(main.oid).unwrap();
              let ours = commit(&s, tree(&s, b"ours"), main.oid, 1);
              let theirs = commit(&s, tree(&s, b"theirs"), main.oid, 2);
              s.meta.insert_ref("heads/ours", ours, "commit", false, false, "test", "test").unwrap();
              s.meta.insert_ref("heads/theirs", theirs, "commit", false, false, "test", "test").unwrap();

              let err = forge.merge(&root, "heads/ours", "heads/theirs", None).unwrap_err();
              let Error::MergeConflict(oid) = err else { panic!("expected conflict: {err:?}"); };
              let rendered = forge.show(&root, &oid.hex()).unwrap();

              assert!(rendered.contains(&format!("conflict {oid}")));
              assert!(rendered.contains(&format!("ours {}", base.tree)) || rendered.contains("ours "));
              assert!(rendered.contains("theirs "));
              assert!(rendered.contains("path same.txt a="));
              assert!(rendered.contains(" b="));
              assert!(rendered.contains(" base="));
              assert!(rendered.contains("causal "));
          }
          RS

          git rm .github/workflows/autopatch-show-conflict-106.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-api/src/lib.rs crates/forge-api/tests/show_conflict.rs
          git commit -m 'cli: render actionable conflict objects (#106)'
          git push origin HEAD:cli/show-conflict-106
