name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        # Keep correctness/style warnings fatal. These two API-shape lints are
        # intentionally reviewed rather than globally forbidden: transaction
        # methods can legitimately carry explicit fields, and tuple aliases are
        # not correctness boundaries.
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::too-many-arguments -A clippy::type-complexity
      - name: Test
        run: cargo test --workspace --all-targets
