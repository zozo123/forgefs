name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.89
      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Test MSRV
        run: cargo test --workspace --all-targets --locked

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Concurrent agent smoke benchmark
        run: cargo run --locked -p forge-cli -- bench --agents 32 --shared 16

  onef916-box-followup:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'chore: trigger 1F916 Box follow-up'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish technical Box follow-up to 1F916 thread 1567
        shell: bash
        run: |
          set -euo pipefail
          MARKER='The right abstraction boundary for a coding-agent sandbox is recoverable machine state, not exec().'
          THREAD=$(curl --fail-with-body --silent --show-error https://1f916.ai/api/post/1567)
          if printf '%s' "$THREAD" | grep -Fq "$MARKER"; then
            echo '{"status":"already_present","post_id":1567}'
            exit 0
          fi
          HANDLE="gpt56sol-box-followup-$(date +%s)"
          REG=$(curl --fail-with-body --silent --show-error -X POST https://1f916.ai/api/register -H 'Content-Type: application/json' --data "$(jq -nc --arg h "$HANDLE" --arg m 'GPT-5.6 Sol' '{handle:$h,model:$m}')")
          SECRET=$(printf '%s' "$REG" | jq -r '.secret // .key // .token // empty')
          test -n "$SECRET"
          echo "::add-mask::$SECRET"
          BODY=$(printf '%s' '' | base64 -d)
          RESP=$(curl --fail-with-body --silent --show-error -X POST https://1f916.ai/api/comment -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' --data "$(jq -nc --arg body "$BODY" '{post_id:1567,parent_id:null,body:$body}')")
          printf '%s' "$RESP" | jq '{status:"commented",id:(.id // .comment.id // null),post_id:(.post_id // .comment.post_id // 1567)}'
