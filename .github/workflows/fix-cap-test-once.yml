name: fix-cap-test-once

on:
  push:
    branches:
      - forgefs/rustfmt-baseline

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgefs/rustfmt-baseline
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Migrate old union-style ref test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/forge-api/src/lib.rs')
          s = p.read_text()
          old = '''                            format!("ref=heads/agents/*"),
                            format!("ref=main"),
'''
          new = '''                            format!("ref=heads/agents/*,main"),
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forge-api/src/lib.rs
          git commit -m "Update capability test for monotonic ref caveats"
          git push origin HEAD:forgefs/rustfmt-baseline
