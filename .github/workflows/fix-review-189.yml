name: fix-review-189

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: fix-review-189-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/post-merge-init-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/post-merge-init-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Apply final review fixes
        run: python3 .github/scripts/fix_review_189.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --all-targets --locked
          cargo +1.89.0 test --workspace --all-targets --locked
      - name: Commit product changes and self-delete
        run: |
          rm .github/workflows/fix-review-189.yml .github/scripts/fix_review_189.py .github/trigger-fix-review-189
          git config user.name 'forgefs-hardening'
          git config user.email 'zozo123@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address final init hardening review'
          git push origin HEAD:fix/post-merge-init-hardening
