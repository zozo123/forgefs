name: fmt-exit-code-163

on:
  push:
    branches: [cli/exit-code-120]

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cli/exit-code-120
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatted product diff and self-delete
        run: |
          git rm .github/workflows/fmt-exit-code-163.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-cli/src/main.rs crates/forge-cli/tests/e2e.rs
          git commit -m 'style: rustfmt stable CLI exit-code ABI (#163)'
          git push origin HEAD:cli/exit-code-120
