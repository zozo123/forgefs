name: format-canonical-once
on:
  push:
    branches: [forgefs/p0-canonical-codec]
permissions:
  contents: write
jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatted source and self-delete
        run: |
          rm .github/workflows/format-canonical-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-core/src/cbor.rs crates/forge-core/src/object.rs crates/forge-core/tests/canonical_decode.rs .github/workflows/format-canonical-once.yml
          git commit -m 'Format canonical codec hardening'
          git push
