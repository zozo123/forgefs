name: fsck-wire-driver

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'forgefs/fsck-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Wire fsck and run integrity tests
        run: |
          python3 .github/scripts/fsck_wire.py
          cargo fmt --all
          cargo test -p forge-api --test fsck --locked
          cargo test -p forge-store --all-targets --locked
          cargo test -p forge-cli --all-targets --locked
      - name: Commit product-only fsck
        run: |
          rm .github/workflows/fsck-wire-driver.yml .github/scripts/fsck_wire.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'P1: add durable typed forge fsck'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
