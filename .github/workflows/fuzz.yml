name: fuzz

on:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'crates/forge-core/src/**'
      - 'crates/forge-cap/src/**'
      - 'crates/forge-protocol/src/**'
      - 'crates/forge-api/src/**'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'fuzz/**'
      - 'crates/forge-core/src/**'
      - 'crates/forge-cap/src/**'
      - 'crates/forge-protocol/src/**'
      - 'crates/forge-api/src/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-build
      - name: Compile every fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Object decoder fuzz smoke
        run: cargo +nightly fuzz run object_decode -- -max_total_time=60 -rss_limit_mb=2048
      - name: Capability parser fuzz smoke
        run: cargo +nightly fuzz run cap_token -- -max_total_time=60 -rss_limit_mb=2048
      - name: Protocol dispatch fuzz smoke
        run: cargo +nightly fuzz run protocol_frame -- -max_total_time=60 -rss_limit_mb=2048
