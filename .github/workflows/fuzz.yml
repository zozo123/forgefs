name: fuzz

on:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'crates/forge-core/src/**'
      - 'crates/forge-cap/src/**'
      - 'crates/forge-protocol/src/**'
      - 'crates/forge-api/src/**'
      - '.github/workflows/fuzz.yml'
      - '.github/scripts/run-fuzz.py'
  push:
    branches:
      - main
    paths:
      - 'fuzz/**'
      - 'crates/forge-core/src/**'
      - 'crates/forge-cap/src/**'
      - 'crates/forge-protocol/src/**'
      - 'crates/forge-api/src/**'
      - '.github/workflows/fuzz.yml'
      - '.github/scripts/run-fuzz.py'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-build
      - name: Compile every fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  fuzz-sustained:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - object_decode
          - cap_token
          - protocol_frame
          - tree_name
          - ref_name
          - tar_roundtrip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fuzz-nightly-${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz for ten minutes and retain the outcome
        env:
          FORGE_FUZZ_TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/run-fuzz.py
      - name: Preserve corpus, crashes and execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            fuzz/evidence/
            fuzz/corpus/${{ matrix.target }}/
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: error
