name: gold-remaining-driver

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'forgefs/gold-v1-p0-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply remaining P0 delta and adversarial tests
        run: |
          python3 .github/scripts/gold_remaining_patch.py
          cargo fmt --all
          cargo test -p forge-store --all-targets --locked
          cargo test -p forge-merge --all-targets --locked
          cargo test -p forge-api --all-targets --locked
      - name: Commit product-only result
        run: |
          rm .github/workflows/gold-remaining-driver.yml .github/scripts/gold_remaining_patch.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'P0: make session state atomic and scrub root secret metadata'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
