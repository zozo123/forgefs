# TEMPORARY: one-shot trusted replay of three reviewed branch workers.
# Delete immediately after the clean replacement PRs are opened.
name: integration-harvest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integration-harvest.yml

permissions:
  contents: write

jobs:
  contribution:
    if: github.repository == 'zozo123/forgefs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: objects/contribution-108-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Replay pinned Contribution worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main objects/contribution-108
          git show 13f509ff298328d7f3a3811d2454f3a791c4880a:.github/swarm-worker.sh > /tmp/worker.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/worker.sh')
          s = p.read_text()
          s = s.replace(
              'git rm -f .github/workflows/autopatch-contribution-108.yml .github/worker-trigger-108 .github/swarm-worker.sh',
              'git rm -f .github/workflows/run-contribution-v2.yml',
          )
          s = s.replace('git push origin HEAD:objects/contribution-108', 'git push origin HEAD:objects/contribution-108-v2')
          p.write_text(s)
          PY
          bash /tmp/worker.sh

  durability-batch:
    if: github.repository == 'zozo123/forgefs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/durability-batch-102-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Replay pinned durability worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main perf/durability-batch-102
          git show 54a4068a051377fe2653ef19eb03ab7301337e5d:.github/swarm-worker.sh > /tmp/worker.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/worker.sh')
          s = p.read_text()
          s = s.replace('git rm -f .github/swarm-worker.sh || true', 'git rm -f .github/workflows/run-batch-v2.yml || true')
          s = s.replace('git push origin HEAD:perf/durability-batch-102', 'git push origin HEAD:perf/durability-batch-102-v2')
          p.write_text(s)
          PY
          bash /tmp/worker.sh

  inbox:
    if: github.repository == 'zozo123/forgefs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agents/inbox-111-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Replay pinned inbox composition worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main agents/inbox-111
          git show 9242739f34a8edcf13a83fc74eed180b9af6a9c5:.github/swarm-worker.sh > /tmp/worker.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/worker.sh')
          s = p.read_text()
          s = s.replace(
              'rm -f .github/workflows/rebase-inbox-168.yml .github/workflows/autopatch-inbox-111.yml .github/worker-trigger-168',
              'rm -f .github/workflows/rebase-inbox-168.yml .github/workflows/autopatch-inbox-111.yml .github/worker-trigger-168 .github/workflows/apply-inbox-168-v2.yml',
          )
          s = s.replace('git push origin HEAD:agents/inbox-111', 'git push origin HEAD:agents/inbox-111-v2')
          p.write_text(s)
          PY
          bash /tmp/worker.sh
