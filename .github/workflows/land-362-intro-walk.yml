name: land-362-intro-walk

on:
  push:
    branches:
      - perf/362-streaming-intro-walk-main

permissions:
  contents: write

jobs:
  land-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Apply the already-proven item-5 tree delta onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin perf/362-streaming-intro-walk
          git merge --squash origin/perf/362-streaming-intro-walk
      - name: Prove clean product tree
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --locked -p forge-store --test large_blob_memory -- --nocapture
          cargo test --workspace --all-targets --locked
      - name: Commit only the item-5 product delta
        run: |
          rm .github/workflows/land-362-intro-walk.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(store): stream typed Blob validation in intro walk (#362)'
          git push origin HEAD:perf/362-streaming-intro-walk-main
