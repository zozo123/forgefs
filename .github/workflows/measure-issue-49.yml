name: issue-49-barriered-measurement

on:
  push:
    branches:
      - perf/49-group-observations
    paths:
      - .github/workflows/measure-issue-49.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out measured head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0

      - name: Prove barriers and run controlled comparison
        run: python3 .github/scripts/measure-issue-49.py

      - name: Upload raw measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-49-observation-grouping
          path: |
            issue49-results.json
            issue49-results.md
          if-no-files-found: warn
          retention-days: 30
