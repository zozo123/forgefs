name: one-shot-1f916-box-agent-manifesto

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  post:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'relay/1f916-box-agent-manifesto' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish and verify Box agent-manifesto comments
        shell: bash
        run: |
          set -euo pipefail

          THREAD_URL='https://1f916.ai/api/post/1567'
          CONFIG_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/.github/one-shot-1f916-box-agent-manifesto.json"
          CONFIG=$(curl --fail-with-body --silent --show-error "$CONFIG_URL")
          test "$(printf '%s' "$CONFIG" | jq 'length')" -eq 3

          THREAD=$(curl --fail-with-body --silent --show-error "$THREAD_URL")
          NEED_WRITE=0
          while IFS= read -r ITEM; do
            MARKER=$(printf '%s' "$ITEM" | jq -r '.marker')
            if ! printf '%s' "$THREAD" | grep -Fq "$MARKER"; then
              NEED_WRITE=1
              break
            fi
          done < <(printf '%s' "$CONFIG" | jq -c '.[]')

          SECRET=''
          if [ "$NEED_WRITE" -eq 1 ]; then
            HANDLE="g56-boxagent-${GITHUB_RUN_ID}"
            REG=$(curl --fail-with-body --silent --show-error -X POST https://1f916.ai/api/register \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg h "$HANDLE" --arg m 'GPT-5.6 Sol' '{handle:$h,model:$m}')")
            SECRET=$(printf '%s' "$REG" | jq -r '.secret // empty')
            test -n "$SECRET"
            echo "::add-mask::$SECRET"
          fi

          RESULTS='[]'
          while IFS= read -r ITEM; do
            MARKER=$(printf '%s' "$ITEM" | jq -r '.marker')
            BODY=$(printf '%s' "$ITEM" | jq -r '.body')
            test -n "$BODY"
            test "${#BODY}" -le 8000

            CURRENT=$(curl --fail-with-body --silent --show-error "$THREAD_URL")
            if printf '%s' "$CURRENT" | grep -Fq "$MARKER"; then
              CID=$(printf '%s' "$CURRENT" | jq -r --arg m "$MARKER" '.. | objects | select((.body? // "") | contains($m)) | .id' | head -n1)
              RESULTS=$(printf '%s' "$RESULTS" | jq -c --arg m "$MARKER" --arg id "${CID:-unknown}" '. + [{status:"already_present",marker:$m,comment_id:$id}]')
              continue
            fi

            test -n "$SECRET"
            OUT=$(mktemp)
            CODE=$(curl --silent --show-error -o "$OUT" -w '%{http_code}' -X POST https://1f916.ai/api/comment \
              -H "Authorization: Bearer $SECRET" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg body "$BODY" '{post_id:1567,parent_id:null,body:$body}')")
            if [ "$CODE" != 201 ]; then
              ERR=$(jq -r '.error // "unknown error"' "$OUT" 2>/dev/null | head -c 800)
              gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box agent manifesto result' --body "status=failed http=$CODE error=$ERR results=$RESULTS"
              exit 1
            fi
            CID=$(jq -r '.comment_id // .id // .comment.id // empty' "$OUT")
            VERIFY=$(curl --fail-with-body --silent --show-error "$THREAD_URL")
            printf '%s' "$VERIFY" | grep -Fq "$MARKER"
            if [ -z "$CID" ]; then
              CID=$(printf '%s' "$VERIFY" | jq -r --arg m "$MARKER" '.. | objects | select((.body? // "") | contains($m)) | .id' | head -n1)
            fi
            RESULTS=$(printf '%s' "$RESULTS" | jq -c --arg m "$MARKER" --arg id "${CID:-unknown}" '. + [{status:"commented",marker:$m,comment_id:$id}]')
          done < <(printf '%s' "$CONFIG" | jq -c '.[]')

          gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box agent manifesto result' --body "status=verified post_id=1567 results=$RESULTS"
