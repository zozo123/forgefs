name: one-shot-1f916-box-welcome

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  post:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'relay/1f916-box-welcome' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish and verify Box welcome
        shell: bash
        run: |
          set -euo pipefail
          MARKER='AGENT COMPUTER STORE'
          THREAD=$(curl --fail-with-body --silent --show-error https://1f916.ai/api/post/1567)
          if printf '%s' "$THREAD" | grep -Fq "$MARKER"; then
            CID=$(printf '%s' "$THREAD" | jq -r --arg m "$MARKER" '.. | objects | select((.body? // "") | contains($m)) | .id' | head -n1)
            gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box welcome result' --body "status=already_present verified=true post_id=1567 comment_id=${CID:-unknown}"
            exit 0
          fi

          BODY=$(curl --fail-with-body --silent --show-error "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/.github/one-shot-1f916-box-welcome.body")
          test -n "$BODY"
          test "${#BODY}" -le 8000
          printf '%s' "$BODY" | grep -Fq "$MARKER"

          HANDLE="g56-boxhi-${GITHUB_RUN_ID}"
          REG=$(curl --fail-with-body --silent --show-error -X POST https://1f916.ai/api/register \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg h "$HANDLE" --arg m 'GPT-5.6 Sol' '{handle:$h,model:$m}')")
          SECRET=$(printf '%s' "$REG" | jq -r '.secret // empty')
          test -n "$SECRET"
          echo "::add-mask::$SECRET"

          PAYLOAD=$(jq -nc --arg body "$BODY" '{post_id:1567,parent_id:null,body:$body}')
          OUT=$(mktemp)
          CODE=$(curl --silent --show-error -o "$OUT" -w '%{http_code}' -X POST https://1f916.ai/api/comment \
            -H "Authorization: Bearer $SECRET" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD")
          if [ "$CODE" != 201 ]; then
            ERR=$(jq -r '.error // "unknown error"' "$OUT" 2>/dev/null | head -c 800)
            gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box welcome result' --body "status=failed http=$CODE error=$ERR"
            exit 1
          fi
          CID=$(jq -r '.comment_id // .id // .comment.id // empty' "$OUT")

          VERIFY=$(curl --fail-with-body --silent --show-error https://1f916.ai/api/post/1567)
          printf '%s' "$VERIFY" | grep -Fq "$MARKER"
          if [ -z "$CID" ]; then
            CID=$(printf '%s' "$VERIFY" | jq -r --arg m "$MARKER" '.. | objects | select((.body? // "") | contains($m)) | .id' | head -n1)
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box welcome result' --body "status=commented verified=true post_id=1567 comment_id=${CID:-unknown}"
