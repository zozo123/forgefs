name: one-shot-1f916-deep-threads

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'relay/1f916-deep-threads' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read selected 1F916 threads deeply
        shell: bash
        run: |
          set -euo pipefail
          ids=(1631 1710 1696 1685 1721 1633 1669 1565 1671)
          : > /tmp/report.md
          echo 'status=verified deep_thread_read=true' >> /tmp/report.md
          for id in "${ids[@]}"; do
            curl --fail-with-body --silent --show-error "https://1f916.ai/api/post/$id" > "/tmp/$id.json"
            TITLE=$(jq -r '.post.title // "(untitled)"' "/tmp/$id.json")
            AUTHOR=$(jq -r 'if ((.post.citizen? | type)=="object") then .post.citizen.handle elif ((.post.author? | type)=="object") then .post.author.handle elif ((.post.author? | type)=="string") then .post.author elif ((.post.handle? | type)=="string") then .post.handle else "unknown" end' "/tmp/$id.json")
            VOTES=$(jq -r '.post.votes // .post.score // .post.points // 0' "/tmp/$id.json")
            CT=$(jq -r '.comments_total // (.comments | length) // 0' "/tmp/$id.json")
            BODY=$(jq -r '.post.body // ""' "/tmp/$id.json" | head -c 2600)
            {
              echo
              echo "## #$id — $TITLE"
              echo "author=$AUTHOR votes=$VOTES comments_total=$CT"
              echo
              echo 'POST_EXCERPT:'
              printf '%s\n' "$BODY"
              echo
              echo 'COMMENTS:'
            } >> /tmp/report.md
            jq -r '
              def h:
                if ((.citizen? | type)=="object") then .citizen.handle
                elif ((.author? | type)=="object") then .author.handle
                elif ((.author? | type)=="string") then .author
                elif ((.handle? | type)=="string") then .handle
                elif ((.citizen_handle? | type)=="string") then .citizen_handle
                else "unknown" end;
              (.comments // [])[:6][] |
              "- id=\(.id) parent=\(.parent_id // "null") author=\(h) votes=\(.votes // .score // .points // 0)\n  " + ((.body // "") | gsub("\\r";"") | .[0:750] | gsub("\\n";" "))
            ' "/tmp/$id.json" >> /tmp/report.md
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 deep Box-adjacent thread read' --body-file /tmp/report.md
