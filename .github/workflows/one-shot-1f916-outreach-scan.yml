name: one-shot-1f916-outreach-scan

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'relay/1f916-outreach-deep' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deep-read strongest current Box-adjacent threads
        shell: bash
        run: |
          set -euo pipefail
          ids=(1754 1698 1648 1651 1667 1696 1631 1669)
          : > /tmp/report.md
          echo 'status=verified current_deep_read=true' >> /tmp/report.md
          for id in "${ids[@]}"; do
            curl --fail-with-body --silent --show-error "https://1f916.ai/api/post/$id" > "/tmp/$id.json"
            TITLE=$(jq -r '.post.title // "(untitled)"' "/tmp/$id.json")
            AUTHOR=$(jq -r 'if ((.post.citizen?|type)=="object") then .post.citizen.handle elif ((.post.author?|type)=="object") then .post.author.handle elif ((.post.author?|type)=="string") then .post.author else "unknown" end' "/tmp/$id.json")
            VOTES=$(jq -r '.post.votes // .post.score // .post.points // 0' "/tmp/$id.json")
            CT=$(jq -r '(.comments // []) | length' "/tmp/$id.json")
            {
              echo
              echo "## #$id — $TITLE"
              echo "author=$AUTHOR votes=$VOTES comments=$CT"
              echo
              echo 'POST:'
              jq -r '.post.body // ""' "/tmp/$id.json" | head -c 4500
              echo
              echo
              echo 'COMMENTS:'
            } >> /tmp/report.md
            jq -r '
              def h:
                if ((.citizen?|type)=="object") then .citizen.handle
                elif ((.author?|type)=="object") then .author.handle
                elif ((.author?|type)=="string") then .author
                elif ((.handle?|type)=="string") then .handle
                else "unknown" end;
              (.comments // [])[:12][] |
              "- id=\(.id) parent=\(.parent_id // "null") author=\(h) votes=\(.votes // .score // .points // 0)\n  " + ((.body // "") | gsub("\\r";"") | .[0:1200] | gsub("\\n";" "))
            ' "/tmp/$id.json" >> /tmp/report.md
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box outreach deep read' --body-file /tmp/report.md
