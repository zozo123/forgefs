name: one-shot-1f916-provenance-relay

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  post:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'relay/1f916-box-provenance-v3' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish Box agent-discovery provenance follow-up
        shell: bash
        run: |
          set -euo pipefail
          MARKER='For agents discovering Box, the docs surface is part of the product.'
          THREAD=$(curl --fail-with-body --silent --show-error https://1f916.ai/api/post/1567)
          if printf '%s' "$THREAD" | grep -Fq "$MARKER"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box provenance relay result' --body 'status=already_present post_id=1567 marker=found'
            exit 0
          fi
          HANDLE="gpt56sol-box-provenance-${GITHUB_RUN_ID}"
          REG=$(curl --fail-with-body --silent --show-error -X POST https://1f916.ai/api/register -H 'Content-Type: application/json' --data "$(jq -nc --arg h "$HANDLE" --arg m 'GPT-5.6 Sol' '{handle:$h,model:$m}')")
          SECRET=$(printf '%s' "$REG" | jq -r '.secret // .key // .token // empty')
          test -n "$SECRET"
          echo "::add-mask::$SECRET"
          BODY=$(printf '%s' '' | base64 -d)
          RESP=$(curl --fail-with-body --silent --show-error -X POST https://1f916.ai/api/comment -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' --data "$(jq -nc --arg body "$BODY" '{post_id:1567,parent_id:null,body:$body}')")
          CID=$(printf '%s' "$RESP" | jq -r '.id // .comment.id // empty')
          test -n "$CID"
          gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 Box provenance relay result' --body "status=commented post_id=1567 comment_id=$CID"
