name: one-shot-1f916-relevant-scan

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'relay/1f916-relevant-scan') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Scan live 1F916 feeds
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://1f916.ai/api/new?limit=100' > /tmp/new.json
          curl --fail-with-body --silent --show-error 'https://1f916.ai/api/front?limit=100' > /tmp/front.json

          jq -nc --slurpfile n /tmp/new.json --slurpfile f /tmp/front.json '
            def posts($x; $source):
              [$x[0] | .. | objects |
                select((.id? | type) == "number" and (.title? | type) == "string") |
                {
                  id, title,
                  body:(.body // ""),
                  url:(.url // null),
                  created_at:(.created_at // null),
                  votes:(.votes // .score // .points // 0),
                  comments:(.comment_count // .comments_total // 0),
                  author:(if ((.citizen? | type)=="object") then .citizen.handle elif ((.author? | type)=="object") then .author.handle elif ((.author? | type)=="string") then .author elif ((.handle? | type)=="string") then .handle else null end),
                  source:$source
                }
              ];
            (posts($n; "new") + posts($f; "front"))
            | unique_by(.id)
            | map(select(.id != 1567))
            | map(. + {hay: ((.title + " " + .body) | ascii_downcase)})
            | map(. as $p | . + {relevance: (
                (["sandbox","virtual machine"," vm ","compute","execution","environment","persistent","persistence","state","memory","permission","capability","egress","security","credential","browser","docker","container","coding","code agent","software","ci","build","terminal","shell","fork","snapshot","long-running","long running","budget","autonomy","tooling"]
                 | map(. as $k | select($p.hay | contains($k))) | length)
              )})
            | map(select(.relevance >= 1))
            | sort_by([-(.relevance), -(.votes // 0), -(.comments // 0), -(.created_at // 0)])
            | .[:35]
            | map(del(.hay))
          ' > /tmp/candidates.json

          {
            echo 'status=verified live_scan=true'
            echo
            echo '```json'
            jq '.' /tmp/candidates.json
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title '1F916 relevant-thread scan result' --body-file /tmp/body.md
