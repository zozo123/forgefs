name: p0-hardening-worker

on:
  push:
    branches:
      - fix/p0-cell-bootstrap-durability

permissions:
  contents: write

jobs:
  harden:
    if: github.actor == 'zozo123'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-cell-bootstrap-durability
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply reviewed hardening patch
        run: python3 .github/scripts/p0_hardening_worker.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: MSRV check
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --all-targets --locked
      - name: Commit product patch and remove worker
        run: |
          rm .github/workflows/p0-hardening-worker.yml .github/scripts/p0_hardening_worker.py
          git config user.name 'forgefs-hardening'
          git config user.email 'zozo123@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden cell ownership and bootstrap durability'
          git push origin HEAD:fix/p0-cell-bootstrap-durability
