name: p0-session-atomic-runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'forgefs/p0-session-atomic' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply atomic session/checkin transitions
        run: |
          git show origin/main:.github/scripts/p0_session_atomic_patch.py > /tmp/p0_session_atomic_patch.py
          python3 /tmp/p0_session_atomic_patch.py
          cargo fmt --all
          cargo test -p forge-store --all-targets --locked
          cargo test -p forge-api --all-targets --locked
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-store/src/meta.rs crates/forge-store/src/lib.rs crates/forge-store/tests/session_atomicity.rs crates/forge-api/src/lib.rs
          git commit -m 'P0: make session and checkin metadata atomic'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
