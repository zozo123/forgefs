name: p0-trust-pr-runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'forgefs/p0-trust-final' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply trust P0
        run: |
          git show origin/main:.github/scripts/p0_trust_patch.py > /tmp/p0_trust_patch.py
          python3 /tmp/p0_trust_patch.py
          git show origin/forgefs/p0-api-trust-final:crates/forge-api/tests/trust_boundary.rs > crates/forge-api/tests/trust_boundary.rs
          cargo fmt --all
          cargo test -p forge-api --test trust_boundary --locked
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-api/src/lib.rs crates/forge-api/tests/trust_boundary.rs
          git commit -m 'P0: close Forge API trust boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
