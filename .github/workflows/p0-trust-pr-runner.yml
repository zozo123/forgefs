name: p0-trust-pr-runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'forgefs/p0-trust-final' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply trust P0
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/forge-api/src/lib.rs')
          s = p.read_text()
          if 'fn validate_key_permissions(path: &Path)' in s:
              raise SystemExit('already applied')

          old = 'use forge_core::{hash_bytes, now_ms, Commit, Snapshot, Tree};'
          if old not in s: raise SystemExit('forge_core imports changed')
          s = s.replace(old, 'use forge_core::{hash_bytes, now_ms, Blob, Commit, Conflict, Snapshot, Tree};', 1)
          old = 'use forge_merge::{lca, three_way, MergeOutcome};'
          if old not in s: raise SystemExit('merge imports changed')
          s = s.replace(old, 'use forge_merge::{merge_bases, three_way, MergeOutcome};', 1)
          if '    pub store: Store,' not in s: raise SystemExit('Forge.store anchor missing')
          s = s.replace('    pub store: Store,', '    store: Store,', 1)

          old = '        fs::create_dir_all(root.join("keys"))?;'
          if old not in s: raise SystemExit('key-dir anchor missing')
          s = s.replace(old, '        secure_key_dir(&root.join("keys"))?;', 1)

          key = 'root.join("keys/integrator.cap")'
          k = s.index(key)
          close = s.index('        )?;', k) + len('        )?;')
          s = s[:close] + '\n        sync_dir(&root.join("keys"))?;' + s[close:]

          old = '        let hmac = read32(&root.join("keys/root.secret"))?;'
          if old not in s: raise SystemExit('open-key anchor missing')
          s = s.replace(old, '        validate_key_permissions(&root.join("keys"))?;\n' + old, 1)

          ms = s.index('            let base = lca(&self.store, into_row.oid, theirs_oid)?;')
          me = s.index('            match three_way(&self.store, base_tree, ours_c.tree, theirs_c.tree)? {', ms)
          me += len('            match three_way(&self.store, base_tree, ours_c.tree, theirs_c.tree)? {')
          merge = r'''            let bases = merge_bases(&self.store, into_row.oid, theirs_oid)?;
          if bases.len() > 1 {
              let base_trees = bases
                  .iter()
                  .map(|id| self.store.get_commit(*id).map(|c| c.tree))
                  .collect::<Result<Vec<_>>>()?;
              let conflict = Conflict {
                  bases: base_trees,
                  ours: ours_c.tree,
                  theirs: theirs_c.tree,
                  paths: vec![],
                  causal: vec![into_row.oid, theirs_oid],
              };
              let oid = self.store.put_conflict(&conflict)?;
              let name = format!("conflicts/{into}/{}", ulid::Ulid::new());
              self.store.meta.insert_ref(
                  &name, oid, "conflict", false, false, cap.agent_id(), "multiple-merge-bases",
              )?;
              return Err(Error::MergeConflict(oid));
          }
          let base_tree = match bases.as_slice() {
              [id] => Some(self.store.get_commit(*id)?.tree),
              [] => None,
              _ => unreachable!("multiple bases handled above"),
          };
          match three_way(&self.store, base_tree, ours_c.tree, theirs_c.tree)? {'''
          s = s[:ms] + merge + s[me:]

          vs = s.index('    pub fn verify_tag(&self, cap: &Cap, tag: &str) -> Result<ObjectId> {')
          ve = s.index('\n    pub fn export_tar(', vs)
          verify = r'''    pub fn verify_tag(&self, cap: &Cap, tag: &str) -> Result<ObjectId> {
          let tag_ref_name = format!("tags/{tag}");
          self.check(cap, Op::Read, Some(&tag_ref_name))?;
          let tag_ref = self
              .store
              .meta
              .get_ref(&tag_ref_name)?
              .ok_or_else(|| Error::NotFound(format!("ref {tag_ref_name}")))?;
          let (snap_oid, commit_oid, tree_oid) = self
              .store
              .meta
              .get_seal(tag)?
              .ok_or_else(|| Error::NotFound(format!("tag {tag}")))?;
          if tag_ref.oid != snap_oid || tag_ref.kind != "snapshot" || !tag_ref.protected || !tag_ref.sealed {
              return Err(Error::Corrupt("sealed tag ref metadata mismatch".into()));
          }

          let snap = Snapshot::decode(&self.store.get_raw_verified(snap_oid)?)?;
          if snap.pk != self.seal_pk {
              return Err(Error::Corrupt("snapshot key is not this forge's trusted seal key".into()));
          }
          if snap.tag != tag {
              return Err(Error::Corrupt("snapshot tag mismatch".into()));
          }
          if snap.commit != commit_oid || snap.tree != tree_oid {
              return Err(Error::Corrupt("seal table snapshot mismatch".into()));
          }
          let commit = Commit::decode(&self.store.get_raw_verified(commit_oid)?)?;
          if commit.tree != tree_oid {
              return Err(Error::Corrupt("sealed commit tree mismatch".into()));
          }
          Blob::decode(&self.store.get_raw_verified(snap.prov)?)?;

          let h = hash_bytes(&snap.encode_unsigned());
          let pk = VerifyingKey::from_bytes(&self.seal_pk)
              .map_err(|e| Error::Corrupt(e.to_string()))?;
          pk.verify(h.as_bytes(), &Signature::from_bytes(&snap.sig))
              .map_err(|_| Error::Corrupt("snapshot signature".into()))?;
          let walked = self.store.reachable_oids_verified(tree_oid)?;
          if !walked.contains(&tree_oid) {
              return Err(Error::Corrupt("tree walk".into()));
          }
          Ok(snap_oid)
      }
      '''
          s = s[:vs] + verify + s[ve:]

          ws = s.index('fn write_secret(path: PathBuf, bytes: &[u8]) -> Result<()> {')
          we = s.index('\nfn read32(', ws)
          helpers = r'''fn secure_key_dir(path: &Path) -> Result<()> {
          fs::create_dir_all(path)?;
          #[cfg(unix)]
          {
              use std::os::unix::fs::PermissionsExt;
              fs::set_permissions(path, fs::Permissions::from_mode(0o700))?;
          }
          Ok(())
      }

      fn validate_key_permissions(path: &Path) -> Result<()> {
          #[cfg(unix)]
          {
              use std::os::unix::fs::PermissionsExt;
              let mode = fs::metadata(path)?.permissions().mode() & 0o777;
              if mode != 0o700 {
                  return Err(Error::Denied(format!("key directory {} must be mode 0700, got {mode:04o}", path.display())));
              }
              for name in ["root.secret", "seal.ed25519", "root.cap", "integrator.cap"] {
                  let secret = path.join(name);
                  let mode = fs::metadata(&secret)?.permissions().mode() & 0o777;
                  if mode != 0o600 {
                      return Err(Error::Denied(format!("secret {} must be mode 0600, got {mode:04o}", secret.display())));
                  }
              }
          }
          Ok(())
      }

      fn write_secret(path: PathBuf, bytes: &[u8]) -> Result<()> {
          #[cfg(unix)]
          let mut f = {
              use std::os::unix::fs::OpenOptionsExt;
              let mut opts = fs::OpenOptions::new();
              opts.write(true).create_new(true).mode(0o600);
              opts.open(&path)?
          };
          #[cfg(not(unix))]
          let mut f = fs::OpenOptions::new().write(true).create_new(true).open(&path)?;
          f.write_all(bytes)?;
          f.sync_all()?;
          Ok(())
      }

      fn sync_dir(path: &Path) -> Result<()> {
          #[cfg(unix)]
          fs::File::open(path)?.sync_all()?;
          #[cfg(not(unix))]
          let _ = path;
          Ok(())
      }
      '''
          s = s[:ws] + helpers + s[we:]
          p.write_text(s)
          PY
          git show origin/forgefs/p0-api-trust-final:crates/forge-api/tests/trust_boundary.rs > crates/forge-api/tests/trust_boundary.rs
          cargo fmt --all
          cargo test -p forge-api --test trust_boundary --locked
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/forge-api/src/lib.rs crates/forge-api/tests/trust_boundary.rs
          git commit -m 'P0: close Forge API trust boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
