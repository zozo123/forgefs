name: post-merge-hardening-worker

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: post-merge-hardening-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/post-merge-init-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/post-merge-init-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply focused review fixes
        run: python3 .github/scripts/post_merge_hardening.py
      - name: Refresh lockfile for direct libc dependency
        run: cargo check --workspace --all-targets
      - name: Format
        run: cargo fmt --all
      - name: Check locked
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --all-targets --locked
          cargo +1.89.0 test --workspace --all-targets --locked
      - name: Commit product patch and remove worker
        run: |
          rm .github/workflows/post-merge-hardening-worker.yml .github/scripts/post_merge_hardening.py .github/trigger-post-merge-hardening
          git config user.name 'forgefs-hardening'
          git config user.email 'zozo123@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close post-merge init and lock races'
          git push origin HEAD:fix/post-merge-init-hardening
