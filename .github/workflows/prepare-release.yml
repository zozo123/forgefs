name: prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump from workspace.package.version
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: prepare-release
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import os, re
          text = open('Cargo.toml', encoding='utf-8').read()
          m = re.search(r'(?ms)^\[workspace\.package\].*?^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not m:
              raise SystemExit('workspace.package.version must be a plain stable SemVer before prepare-release')
          major, minor, patch = map(int, m.groups())
          bump = os.environ['BUMP']
          if bump == 'major':
              major, minor, patch = major + 1, 0, 0
          elif bump == 'minor':
              minor, patch = minor + 1, 0
          elif bump == 'patch':
              patch += 1
          else:
              raise SystemExit(f'unsupported bump: {bump}')
          print(f'current={m.group(1)}.{m.group(2)}.{m.group(3)}')
          print(f'next={major}.{minor}.{patch}')
          PY
      - name: Update the single version source and minimally refresh Cargo.lock
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          path = 'Cargo.toml'
          text = open(path, encoding='utf-8').read()
          new, count = re.subn(
              r'(?ms)(^\[workspace\.package\].*?^version\s*=\s*")[^"]+("\s*$)',
              lambda m: m.group(1) + os.environ['NEXT'] + m.group(2),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('failed to update exactly one workspace.package.version')
          open(path, 'w', encoding='utf-8').write(new)
          PY
          # Let Cargo update only what the manifest change requires in the
          # existing lockfile. Do not use `cargo update`: a release bump must not
          # pull unrelated dependency upgrades into the release-prep PR.
          cargo check --workspace --all-targets
          scripts/verify-tag-version.sh "v$NEXT"
      - name: Gate the prepared release tree
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo build --locked -p forge-cli
          scripts/cli-abi-conformance.sh target/debug/forge
          scripts/release-gate.sh target/debug/forge
          git diff --check
      - name: Open release preparation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          branch="release/v$NEXT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error title=Release branch exists::$branch already exists"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add Cargo.toml Cargo.lock
          git commit -m "release: prepare ForgeFS v$NEXT"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "release: prepare ForgeFS v$NEXT" \
            --body "Bumps the single workspace version to **$NEXT** and refreshes Cargo.lock without updating unrelated dependencies. The prepare workflow already ran fmt/check/clippy/test, the CLI ABI table, and the end-to-end release gate on this exact tree. After merge, tag the merge commit **v$NEXT**; the tag workflow independently re-verifies version + main ancestry, rebuilds all targets, gates the exact packaged binaries, assembles one checksummed payload, attests it, and publishes it."
