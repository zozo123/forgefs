name: prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump from workspace.package.version
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import os, re
          text = open('Cargo.toml', encoding='utf-8').read()
          m = re.search(r'(?ms)^\[workspace\.package\].*?^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not m:
              raise SystemExit('workspace.package.version must be a plain stable SemVer before prepare-release')
          major, minor, patch = map(int, m.groups())
          bump = os.environ['BUMP']
          if bump == 'major':
              major, minor, patch = major + 1, 0, 0
          elif bump == 'minor':
              minor, patch = minor + 1, 0
          elif bump == 'patch':
              patch += 1
          else:
              raise SystemExit(f'unsupported bump: {bump}')
          print(f'current={m.group(1)}.{m.group(2)}.{m.group(3)}')
          print(f'next={major}.{minor}.{patch}')
          PY
      - name: Update the one version source and lockfile
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          path = 'Cargo.toml'
          text = open(path, encoding='utf-8').read()
          new, count = re.subn(
              r'(?ms)(^\[workspace\.package\].*?^version\s*=\s*")[^"]+("\s*$)',
              lambda m: m.group(1) + os.environ['NEXT'] + m.group(2),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('failed to update exactly one workspace.package.version')
          open(path, 'w', encoding='utf-8').write(new)
          PY
          cargo update -w
          scripts/verify-tag-version.sh "v$NEXT"
          cargo check --workspace --all-targets --locked
          git diff --check
          git diff -- Cargo.toml Cargo.lock
      - name: Open release preparation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          branch="release/v$NEXT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error title=Release branch exists::$branch already exists"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add Cargo.toml Cargo.lock
          git commit -m "release: prepare ForgeFS v$NEXT"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "release: prepare ForgeFS v$NEXT" \
            --body "Bumps the single workspace version to **$NEXT** and refreshes Cargo.lock. After this PR merges, create tag **v$NEXT** on the merge commit; the release workflow will independently verify tag/version/main ancestry, gate the exact packaged binaries, attest the immutable payload, and publish it."
