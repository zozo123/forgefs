name: prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump from workspace.package.version
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  validate:
    name: validate release preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: prepare-release
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/prepare-release-version.py
      - name: Update the single version source and minimally refresh Cargo.lock
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: .github/scripts/prepare-release-update.sh
      - name: Gate the prepared release tree
        run: .github/scripts/prepare-release-gate.sh
      - name: Package the exact gated patch
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: .github/scripts/prepare-release-package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preparation
          path: release-preparation/
          if-no-files-found: error
          retention-days: 1

  open-pr:
    name: open release preparation PR
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-preparation
          path: release-preparation
      - name: Apply and revalidate the gated patch
        env:
          NEXT: ${{ needs.validate.outputs.next }}
        run: .github/scripts/prepare-release-apply.sh
      - name: Open release preparation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.validate.outputs.next }}
        run: .github/scripts/prepare-release-pr.sh
