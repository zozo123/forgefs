name: rebase-168

on:
  push:
    branches: [agents/inbox-111]
    paths:
      - .github/workflows/rebase-168.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agents/inbox-111
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase onto current main and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "forgefs-rebase-bot"
          git config user.email "forgefs-rebase-bot@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/rebase-168.yml
          git commit -m "chore: remove temporary rebase worker"
          git push --force-with-lease origin HEAD:agents/inbox-111
