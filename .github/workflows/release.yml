name: release

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**/Cargo.toml'
      - '.github/workflows/release.yml'
      - '.github/scripts/release-*.sh'
      - '.github/scripts/release-sbom.py'
      - 'scripts/release-gate.sh'
      - 'scripts/cli-abi-conformance.sh'
      - 'scripts/verify-tag-version.sh'
      - 'docs/RELEASING.md'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_RUST: '1.97.0'
  MSRV_RUST: '1.89.0'

jobs:
  identity:
    name: release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      publish: ${{ steps.identity.outputs.publish }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version and release identity
        id: identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/release-identity.sh

  gate:
    name: gate (${{ matrix.os }})
    needs: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Prove lockfile is committed
        run: git diff --exit-code -- Cargo.lock

  msrv:
    name: msrv
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.MSRV_RUST }}
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked

  supply-chain:
    name: supply chain
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --deny warnings
      - run: cargo deny --locked check advisories bans licenses sources
      - run: cargo metadata --locked --format-version 1 >/dev/null
      - run: git diff --exit-code -- Cargo.lock

  build:
    name: build ${{ matrix.target }}
    needs: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: ${{ matrix.target }}
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/release-build.sh
      - name: Generate and cross-check the target SBOM
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/release-sbom.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forge-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  reproduce:
    name: reproducible packaging (x86_64-unknown-linux-gnu)
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: x86_64-unknown-linux-gnu
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Prove two clean builds of this commit produce identical bytes
        env:
          TARGET: x86_64-unknown-linux-gnu
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/release-reproduce.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forge-reproduce-x86_64-unknown-linux-gnu
          path: reproduce/
          if-no-files-found: error
          retention-days: 14

  e2e-artifact:
    name: artifact gate ${{ matrix.target }}
    needs:
      - identity
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: forge-${{ matrix.target }}
          path: dist
      - name: Gate the exact shipped binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: .github/scripts/release-e2e-artifact.sh
      - name: Namespace evidence by target
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/release-label-evidence.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-gate-${{ matrix.target }}
          path: labelled/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: assemble immutable release payload
    needs:
      - identity
      - gate
      - msrv
      - supply-chain
      - build
      - e2e-artifact
      - reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: forge-*
          merge-multiple: true
          path: payload
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-gate-*
          merge-multiple: true
          path: payload
      - name: Validate and checksum the exact publication set
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: .github/scripts/release-assemble.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-payload
          path: payload/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: attest exact release payload
    needs:
      - identity
      - assemble
    if: needs.identity.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-payload
          path: payload
      - name: Reverify the exact attested payload
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: .github/scripts/release-verify-payload.sh payload
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: payload/SHA256SUMS

  publish:
    name: publish
    needs:
      - identity
      - assemble
      - attest
    if: needs.identity.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-payload
          path: payload
      - name: Reverify payload and publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.identity.outputs.tag }}
          VERSION: ${{ needs.identity.outputs.version }}
          PRERELEASE: ${{ needs.identity.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/release-publish.sh
