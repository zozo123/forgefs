name: run-batch-v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/durability-batch-102-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Replay reviewed durability generator on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin perf/durability-batch-102
          git show 54a4068a051377fe2653ef19eb03ab7301337e5d:.github/swarm-worker.sh > /tmp/batch-worker.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/batch-worker.sh')
          s = p.read_text()
          s = s.replace(
              'git rm -f .github/swarm-worker.sh || true',
              'git rm -f .github/workflows/run-batch-v2.yml || true',
          )
          s = s.replace(
              'git push origin HEAD:perf/durability-batch-102',
              'git push origin HEAD:perf/durability-batch-102-v2',
          )
          s = s.replace(
              '        let serial = LocalBlobStore::new(d.path().join("serial")).unwrap();',
              '        let serial_root = d.path().join("serial");\n        std::fs::create_dir(&serial_root).unwrap();\n        let serial = LocalBlobStore::new(serial_root).unwrap();',
          )
          s = s.replace(
              '        let batched = LocalBlobStore::new(d.path().join("batched")).unwrap();',
              '        let batched_root = d.path().join("batched");\n        std::fs::create_dir(&batched_root).unwrap();\n        let batched = LocalBlobStore::new(batched_root).unwrap();',
          )
          p.write_text(s)
          PY
          bash /tmp/batch-worker.sh
