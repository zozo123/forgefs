name: run-contribution-v2

on:
  push:
    branches: [objects/contribution-108-v2]
    paths:
      - .github/workflows/run-contribution-v2.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: objects/contribution-108-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Replay reviewed generator on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin objects/contribution-108
          git show 13f509ff298328d7f3a3811d2454f3a791c4880a:.github/swarm-worker.sh > /tmp/contribution-worker.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/contribution-worker.sh')
          s = p.read_text()
          s = s.replace(
              'git rm -f .github/workflows/autopatch-contribution-108.yml .github/worker-trigger-108 .github/swarm-worker.sh',
              'git rm -f .github/workflows/run-contribution-v2.yml',
          )
          s = s.replace(
              'git push origin HEAD:objects/contribution-108',
              'git push origin HEAD:objects/contribution-108-v2',
          )
          p.write_text(s)
          PY
          bash /tmp/contribution-worker.sh
