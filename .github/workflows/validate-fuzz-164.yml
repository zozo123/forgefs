name: validate-fuzz-164

on:
  push:
    branches: [fuzz/protocol-116]

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fuzz/protocol-116
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Compile every fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Record successful validation and self-delete
        run: |
          git rm .github/workflows/validate-fuzz-164.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: protocol fuzz targets compile cleanly (#164)'
          git push origin HEAD:fuzz/protocol-116
