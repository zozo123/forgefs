name: workflow-security

# Defense-in-depth lint. This PR-controlled job is not the merge trust root:
# the protect-main ruleset (.github/rulesets/protect-main.json) and the
# base-branch CODEOWNERS are. See docs/RELEASING.md and issue #51.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/rulesets/**'
      - '.github/CODEOWNERS'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/rulesets/**'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test policy against YAML bypasses
        run: python3 .github/scripts/test-workflow-security.py
      - name: Test release tooling contracts
        run: python3 .github/scripts/test-release-tooling.py
      - name: Test CI admission failures
        run: python3 .github/scripts/test-ci-admission.py
      - name: Test admission contract drift detection
        run: python3 .github/scripts/test-admission-contract.py
      - name: Enforce one admission contract across CI, rulesets and CODEOWNERS
        run: python3 .github/scripts/check-admission-contract.py
      - name: Test fuzz evidence and failure propagation
        run: python3 .github/scripts/test-run-fuzz.py
      - name: Enforce immutable workflow dependencies
        run: python3 .github/scripts/check-workflow-security.py
