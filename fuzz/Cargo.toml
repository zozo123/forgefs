[package]
name = "forgefs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.89"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
forge-core = { path = "../crates/forge-core" }

[[bin]]
name = "object_decode"
path = "fuzz_targets/object_decode.rs"
test = false
doc = false
bench = false

# Keep fuzz-only dependencies out of the production workspace lock/build graph.
[workspace]
members = ["."]
