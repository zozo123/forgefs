[package]
name = "forgefs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.89"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
forge-core = { path = "../crates/forge-core" }
forge-cap = { path = "../crates/forge-cap" }
forge-api = { path = "../crates/forge-api" }
forge-protocol = { path = "../crates/forge-protocol" }
serde_json = "1"

[[bin]]
name = "object_decode"
path = "fuzz_targets/object_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cap_token"
path = "fuzz_targets/cap_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_frame"
path = "fuzz_targets/protocol_frame.rs"
test = false
doc = false
bench = false

# Keep fuzz-only dependencies out of the production workspace lock/build graph.
[workspace]
members = ["."]
